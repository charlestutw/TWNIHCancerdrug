name: 每週檢查健保第九節條文異動

on:
  schedule:
    # 每週五 23:05 UTC（台灣時間週六清晨 07:05）。避開整點以減少排程延遲。
    - cron: "5 23 * * 5"
  workflow_dispatch: {}   # 允許手動觸發

permissions:
  contents: read          # 不再需要 write：改用 artifact，不把 PDF commit 進 repo
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # 需 18+（內建 fetch）

      - name: 驗證現有資料仍合法
        run: node validate-data.js nhi-ch9-data.json

      - name: 偵測條文異動（全 144 條覆蓋）
        id: monitor
        shell: bash              # ← 關鍵：取得 -o pipefail，否則管線退出碼會被 tee 吃掉
        continue-on-error: true   # 有異動時腳本回傳 1，不算 CI 失敗
        run: node sweep-clauses.js --fetch-text | tee monitor-report.txt

      - name: 無異動則結束
        if: steps.monitor.outcome == 'success'
        run: echo "本週無異動。"

      - name: 上傳異動條文的官方 PDF
        if: steps.monitor.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: clause-pdf-${{ github.run_number }}
          path: |
            clause-text/
            monitor-report.txt
          retention-days: 90

      - name: 有異動 → 開 issue 或在既有 issue 留言
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('monitor-report.txt', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const reportSection = [
              '## 偵測報告（' + today + '）',
              '```',
              report.trim(),
              '```',
              '',
              `官方條文 PDF 已附在 [本次執行的 artifact](${runUrl})，或在本機執行 \`node sweep-clauses.js --fetch-text\` 重新取得。`,
            ].join('\n');

            // 確保 nhi-update 標籤存在：標籤不存在時開單可能失敗，
            // 那會重現「偵測到異動卻不通知」的失效模式，故先確保一次。
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: 'nhi-update',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'nhi-update', color: 'B60205',
                description: '健保第九節條文異動，待人工／AI 判讀更新',
              });
              core.info('已建立 nhi-update 標籤。');
            }

            // 防重複：先查有沒有還開著的 nhi-update issue
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nhi-update',
              per_page: 1,
            });

            if (openIssues.length > 0) {
              // 已有未處理的 issue → 留言附上本次報告，不開新的
              const issue = openIssues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '本週排程再次偵測到異動，前次 issue 尚未關閉，故不另開新單。',
                  '',
                  reportSection,
                ].join('\n'),
              });
              core.info(`已在既有 issue #${issue.number} 留言。`);
              return;
            }

            // 沒有未處理的 issue → 開新單
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${today}] 健保第九節條文異動，需更新 nhi-ch9-data.json`,
              labels: ['nhi-update'],
              body: [
                '偵測到官方條文生效日變動。**這不是自動更新** —— 需人工或 AI 判讀官方原文後修改資料。',
                '',
                reportSection,
                '',
                '## 待辦',
                '- [ ] 閱讀 artifact 內的官方 PDF',
                '- [ ] 更新 `nhi-ch9-data.json` 對應條文的 `ind` / `eff` / `src` / `req`（逐字原文，不得濃縮）',
                '- [ ] 新條文另需補 `name` / `brand` / `type` / `cancers`',
                '- [ ] 推進 `version`（例：`2026-11` → `2026-12`）',
                '- [ ] 同步兩個 HTML 的 `EMBEDDED_SEED`',
                '- [ ] `node validate-data.js nhi-ch9-data.json` 零錯誤',
                '- [ ] commit + push 到 `main`（raw 網址即為 App 的自動更新來源）',
                '',
                '詳細欄位定義與更新流程見 `JSON資料維護說明.md`。',
              ].join('\n'),
            });
